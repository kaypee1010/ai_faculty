<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark Attendance | SGT University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=Inconsolata:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7a1f2b; --maroon-dark:#5c1620; --maroon-pale:#f3e3e2;
    --amber:#a8620d; --amber-pale:#f3e8d4;
    --red:#b3261e; --red-pale:#f6dedb;
    --green:#2f6d3a; --green-pale:#e6f2e8;
    --ink:#2a211c; --slate:#6b5f55; --border:#e4d9c8; --border-strong:#cdbea3;
    --parchment:#faf6ec; --card:#fffdf8; --radius:12px;
    --shadow:0 1px 2px rgba(50,30,20,.06), 0 4px 14px rgba(50,30,20,.06);
  }
  *{box-sizing:border-box;}
  body{ margin:0; padding-top:64px; background:var(--parchment); color:var(--ink);
    font-family:'DM Sans',sans-serif; font-size:15px; line-height:1.55; }
  h1{font-family:'DM Serif Display',serif; font-weight:400; margin:0 0 .3em; font-size:22px;}
  nav.nav{ position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center;
    justify-content:space-between; padding:12px 20px; background:rgba(250,246,236,.85);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  .nav-brand{display:flex; align-items:center; gap:10px;}
  .nav-logo{width:34px; height:34px; border-radius:50%; object-fit:cover; background:var(--maroon);}
  .nav-name{font-weight:700; font-size:14px;}
  .nav-sub{font-family:'Inconsolata',monospace; font-size:10.5px; color:var(--slate); text-transform:uppercase; letter-spacing:.04em;}
  .nav-cta{color:var(--maroon-dark); text-decoration:none; font-weight:600; font-size:12.5px;}
  .wrap{max-width:460px; margin:0 auto; padding:26px 18px 60px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px;}
  .eyebrow{font-family:'Inconsolata',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--maroon-dark); margin-bottom:6px;}
  input[type=text]{width:100%; padding:13px 14px; border:1.5px solid var(--border-strong); border-radius:9px;
    font-family:'Inconsolata',monospace; font-size:16px; margin-bottom:10px; background:#fff;}
  .btn{width:100%;font-family:'DM Sans',sans-serif; font-weight:700; font-size:15px; border:none; border-radius:9px; padding:13px 18px; cursor:pointer;}
  .btn-primary{background:var(--maroon); color:#fff;}
  .btn-primary:hover{background:var(--maroon-dark);}
  .btn:disabled{background:var(--border-strong); color:var(--slate); cursor:not-allowed;}
  .banner{border-radius:9px; padding:12px 14px; font-size:13.5px; margin-bottom:14px;}
  .banner.amber{background:var(--amber-pale); color:#6b4405;}
  .banner.red{background:var(--red-pale); color:var(--red);}
  .banner.green{background:var(--green-pale); color:var(--green);}
  .spinner{display:inline-block; width:14px;height:14px;border:2px solid var(--border-strong); border-top-color:var(--maroon);
    border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .meta{font-family:'Inconsolata',monospace; font-size:11px; color:var(--slate); margin-bottom:14px;}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-brand">
    <img class="nav-logo" src="KP_Singh.png" alt="K.P. Singh"/>
    <div>
      <div class="nav-name">K.P. Singh</div>
      <div class="nav-sub" id="navSub">SGT University · Attendance</div>
    </div>
  </div>
  <a class="nav-cta" href="https://kpsingh.in" target="_blank">kpsingh.in ↗</a>
</nav>
<div class="wrap">
  <div class="card">
    <div class="eyebrow">Attendance</div>
    <h1 id="courseTitle">Loading…</h1>
    <div class="meta" id="courseMeta"></div>
    <div id="banner"></div>
    <input type="text" id="rollInput" placeholder="Registration / Roll Number" autocomplete="off">
    <button class="btn btn-primary" id="markBtn" onclick="markAttendance()" disabled>📍 Mark My Attendance</button>
  </div>
</div>
<script>
// v2 (Sep 2026): link now carries a short courseId (e.g. "?course=intro-ai&section=A")
// resolved against courses.json — instead of the raw, URL-encoded Apps Script /exec
// link. This is what keeps the shareable student link short and hides the backend
// URL. Old-style links that still pass a raw "api=" param keep working (legacy mode)
// so any link already circulated to students does not break.
const params = new URLSearchParams(window.location.search);
const LEGACY_API   = params.get('api') || '';
const SECTION      = params.get('section') || '';
const COURSE_PARAM = params.get('course') || '';

let API_URL = '';
let COURSE_LABEL = '';

function banner(html, cls){
  document.getElementById('banner').innerHTML = html ? `<div class="banner ${cls}">${html}</div>` : '';
}

// Apps Script's /exec URL replies with a redirect to a googleusercontent.com
// URL that actually carries the JSON. Real browsers follow this invisibly,
// but some in-app browsers (WhatsApp, Instagram, etc.) don't handle that
// redirect cleanly and hand back an HTML page instead — which breaks
// r.json() with a cryptic "Unexpected token '<'" (the '<' is the start of
// "<!DOCTYPE html>..."). Reading as text first lets us catch that and show
// something a student can actually act on, instead of a raw syntax error.
// backendCall=true adds the WhatsApp/Instagram hint, since that failure mode
// is specific to calls that hit the Apps Script /exec URL, not courses.json.
async function parseJsonSafe(r, backendCall){
  const text = await r.text();
  try {
    return JSON.parse(text);
  } catch (e) {
    const hint = backendCall
      ? ' If you opened this link inside WhatsApp, Instagram, or a similar app, try again in Chrome or Safari directly (tap ⋮ or the share icon → "Open in browser") — that’s the most common cause of this.'
      : '';
    throw new Error('Got an unexpected reply from the server.' + hint);
  }
}

async function resolveCourse(){
  // Legacy mode: an old link that still embeds the raw exec URL directly.
  if (LEGACY_API){
    API_URL = LEGACY_API;
    COURSE_LABEL = COURSE_PARAM;
    return true;
  }
  if (!COURSE_PARAM){
    banner('This link is missing course info — ask your faculty for the correct link.', 'red');
    return false;
  }
  try {
    const r = await fetch('courses.json');
    const list = await parseJsonSafe(r);
    const entry = list.find(c => c.courseId === COURSE_PARAM);
    if (!entry || !entry.execUrl || entry.execUrl.indexOf('PASTE_EXEC_URL') === 0){
      banner('This course link isn’t set up yet — ask your faculty to check courses.json.', 'red');
      return false;
    }
    API_URL = entry.execUrl;
    COURSE_LABEL = entry.courseName;
    return true;
  } catch(e) {
    banner(e.message || 'Could not load course info. Check your connection and try again.', 'red');
    return false;
  }
}

async function checkStatus(){
  if (!API_URL || !SECTION){ banner('This link is missing course/section info — ask your faculty for the correct link.', 'red'); return; }
  try {
    const r = await fetch(`${API_URL}?action=attendance_status&section=${encodeURIComponent(SECTION)}`);
    const j = await parseJsonSafe(r, true);
    if (!j.success){ banner(j.message, 'red'); return; }
    if (j.data.status !== 'OPEN'){
      banner('Attendance is not open right now for this section.', 'amber');
      return;
    }
    document.getElementById('markBtn').disabled = false;
  } catch(e) {
    banner(e.message || 'Could not reach the backend. Check your connection.', 'red');
  }
}

async function init(){
  const ok = await resolveCourse();
  document.getElementById('courseTitle').textContent = COURSE_LABEL || 'Attendance';
  document.getElementById('courseMeta').textContent = SECTION ? ('Section ' + SECTION) : '';
  document.getElementById('navSub').textContent = 'SGT University · ' + (COURSE_LABEL || 'Attendance');
  if (!ok) return;
  if (!SECTION){ banner('This link is missing section info — ask your faculty for the correct link.', 'red'); return; }
  checkStatus();
}
init();

function getPosition(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation){ reject(new Error('Geolocation not supported on this device/browser.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords),
      err => reject(new Error('Could not get your location — allow location access and try again.')),
      { enableHighAccuracy: true, timeout: 15000 }
    );
  });
}

async function markAttendance(){
  const roll = document.getElementById('rollInput').value.trim();
  const btn = document.getElementById('markBtn');
  if (!roll){ banner('Enter your registration number.', 'red'); return; }
  btn.disabled = true;
  banner('<span class="spinner"></span>Getting your location…', 'amber');
  try {
    const coords = await getPosition();
    banner('<span class="spinner"></span>Marking attendance…', 'amber');
    const r = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'mark_attendance', roll, section: SECTION, lat: coords.latitude, lng: coords.longitude })
    });
    const j = await parseJsonSafe(r, true);
    if (!j.success){ banner(j.message, 'red'); btn.disabled = false; return; }
    banner(`✓ Marked present for ${j.data.date}. Attended so far: ${j.data.attendedSoFar}.`, 'green');
  } catch(e) {
    banner(e.message || 'Something went wrong.', 'red');
    btn.disabled = false;
  }
}
</script>
</body>
</html>
